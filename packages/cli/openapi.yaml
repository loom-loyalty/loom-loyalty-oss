components:
  schemas:
    AddScopeRequest:
      type: "object"
      title: "Add Scope Request"
      required:
      - "scopeId"
      properties:
        scopeId:
          type: "string"
          description: "ID of the scope to add to the role"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
      additionalProperties: false
    GrantType:
      type: "string"
      description: "OAuth2 grant type"
      enum:
      - "client_credentials"
      - "refresh_token"
    OAuth2TokenRequest:
      type: "object"
      title: "OAuth2 Token Request"
      required:
      - "grantType"
      properties:
        clientId:
          type: "string"
          description: "The client identifier. Required when grant_type is 'client_credentials'"
        clientSecret:
          type: "string"
          description: "The client secret. Required when grant_type is 'client_credentials'"
        grantType:
          type: "string"
          description: "OAuth2 grant type (client_credentials or refresh_token)"
          enum:
          - "client_credentials"
          - "refresh_token"
        refreshToken:
          type: "string"
          description: "The refresh token. Required when grant_type is 'refresh_token'"
        scope:
          type: "string"
          description: "Space-separated list of requested scopes"
      additionalProperties: false
    SetScopesRequest:
      type: "object"
      title: "Set Scopes Request"
      required:
      - "scopeIds"
      properties:
        scopeIds:
          type: "array"
          items:
            type: "string"
            description: "Set of scope IDs to assign to the role"
            pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
      additionalProperties: false
    EntityType:
      type: "string"
      title: "Entity Type"
      enum:
      - "CUSTOMER"
      - "CUSTOMER_GROUP"
      - "CUSTOMER_AUDIENCE"
      - "PROGRAM"
      - "PARTNER"
      - "PARTNER_PROGRAM"
      - "LOCATION"
      - "ITEM"
      - "METADATA"
      - "OFFER"
      - "ENVIRONMENT_WORKFLOW"
    MatchMode:
      type: "string"
      title: "Match Mode"
      enum:
      - "EQUALS"
      - "CONTAINS"
      - "STARTS_WITH"
      - "ENDS_WITH"
    EntityTargetProgressRequest:
      type: "object"
      title: "Entity Target Progress Request"
      required:
      - "eventDateTime"
      - "eventId"
      - "programId"
      - "type"
      properties:
        amount:
          type: "number"
          description: "Amount to add to the counter target (only for COUNTER type)"
        eventDateTime:
          type: "string"
          format: "date-time"
          description: "When the event occurred"
        eventId:
          type: "string"
          description: "Unique identifier for the event"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
        eventRuleId:
          type: "string"
          description: "Identifier of the event rule"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
        metadataCode:
          type: "string"
          description: "Code for the metadata"
        metadataTypeCode:
          type: "string"
          description: "Type code for the metadata"
        parentEventId:
          type: "string"
          description: "Identifier of the parent event"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
        programId:
          type: "string"
          description: "Identifier of the program"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
        register:
          type: "boolean"
          description: "Whether to register the entity target"
        targetCode:
          type: "string"
          description: "Code of the target"
        targetId:
          type: "string"
          description: "Identifier of the target"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
        type:
          type: "string"
          description: "Discriminator for the entity target progress type"
          enum:
          - "COUNTER"
          - "COMPLETION"
      additionalProperties: false
    EventRuleCategory:
      type: "string"
      title: "Event Rule Category"
      enum:
      - "BASE"
      - "ORGANIZATION_DEFINED"
      - "PARTNER"
      - "ADJUSTMENT"
      - "TIER"
      - "PROMOTION"
      - "TIER_AFTER_PROMOTION"
      - "REDEMPTION"
      - "COMMUNICATION"
    TargetType:
      type: "string"
      title: "Target Type"
      enum:
      - "COMPLETION"
      - "COUNTER"
      - "MILESTONE"
      - "X_OF_Y"
    IdListEventData_UUID_:
      type: "object"
      description: "A list of entity identifiers"
      properties:
        ids:
          type: "array"
          items:
            type: "string"
            pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
    ProgramAccountType:
      type: "string"
      title: "Program Account Type"
      enum:
      - "CUSTOMER_ASSET"
      - "CUSTOMER_GROUP_ASSET"
      - "PROGRAM_LIABILITY"
      - "PARTNER_PROGRAM_LIABILITY"
    ProgramLedgerStatementStatus:
      type: "string"
      description: "Status of a program ledger statement"
      enum:
      - "ACTIVE"
      - "INVALIDATED"
    CustomerCouponUseStatus:
      type: "string"
      title: "Customer Coupon Use Status"
      enum:
      - "HOLD"
      - "USE"
      - "RETURN"
    MetricCategory:
      type: "string"
      title: "Metric Category"
      enum:
      - "CUSTOMER"
      - "EVENT"
      - "OFFER"
      - "PROGRAM"
      - "STATUS"
    MetricScope:
      type: "string"
      title: "Metric Scope"
      enum:
      - "ORGANIZATION"
      - "ENVIRONMENT"
    Any:
      anyOf:
      - type: "string"
      - type: "number"
      - type: "integer"
      - type: "boolean"
      - type: "object"
      - type: "array"
        items: {}
    Boolean:
      type: "boolean"
    Integer:
      type: "integer"
    Number:
      type: "number"
    String:
      type: "string"
    LocalizedString:
      type: "object"
      additionalProperties:
        type: "string"
      description: "Locale-keyed strings (e.g. {\"en\": \"Hello\", \"fr\": \"Bonjour\"\
        })"
    Date:
      format: "date"
      type: "string"
    DateTime:
      format: "date-time"
      type: "string"
    Uuid:
      format: "uuid"
      type: "string"
    EntityId:
      type: "string"
      pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
    EventIdDateTimeEventData:
      type: "object"
      description: "Base event data with event ID and timestamp"
      properties:
        eventId:
          type: "string"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
          description: "Event identifier"
        parentEventId:
          type: "string"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
          description: "Parent event identifier"
        eventDateTime:
          type: "string"
          format: "date-time"
          description: "Event timestamp"
      required:
      - "eventId"
      - "eventDateTime"
    DateTimePeriod:
      type: "object"
      required:
      - "startDateTime"
      properties:
        endDateTime:
          type: "string"
          format: "date-time-local"
          description: "Date-time string without timezone"
        startDateTime:
          type: "string"
          format: "date-time-local"
          description: "Date-time string without timezone"
        timeZone:
          type: "string"
          description: "Timezone identifier"
      additionalProperties: false
    TimeZone:
      type: "string"
    AddCustomerToCustomerAudience:
      type: "object"
      title: "Add Customer To Customer Audience"
      required:
      - "eventDateTime"
      - "eventId"
      properties:
        customerAudienceCode:
          type: "string"
          description: "Code of the customer audience to add the customer to"
        customerAudienceId:
          type: "string"
          description: "ID of the customer audience to add the customer to"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
        dateTimePeriod:
          $ref: "#/components/schemas/DateTimePeriod"
        eventDateTime:
          type: "string"
          format: "date-time"
          description: "Timestamp when the event occurred"
        eventId:
          type: "string"
          description: "Unique identifier for the event"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
        name:
          type: "string"
          description: "Name for this audience membership"
      additionalProperties: false
    AddEntityCounterTarget:
      type: "object"
      title: "Add Entity Counter Target"
      required:
      - "amount"
      - "eventDateTime"
      - "eventId"
      - "programId"
      properties:
        amount:
          type: "number"
          description: "Amount to add to the counter target"
        eventDateTime:
          type: "string"
          format: "date-time"
          description: "When the event occurred"
        eventId:
          type: "string"
          description: "Unique identifier for the event"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
        eventRuleId:
          type: "string"
          description: "Identifier of the event rule"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
        metadataCode:
          type: "string"
          description: "Code for the metadata"
        metadataTypeCode:
          type: "string"
          description: "Type code for the metadata"
        parentEventId:
          type: "string"
          description: "Identifier of the parent event"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
        programId:
          type: "string"
          description: "Identifier of the program"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
        register:
          type: "boolean"
          description: "Whether to register the entity target"
        targetCode:
          type: "string"
          description: "Code of the target"
        targetId:
          type: "string"
          description: "Identifier of the target"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
      additionalProperties: false
    ApproveWorkflowStep:
      type: "object"
      title: "Approve Workflow Step"
      required:
      - "stepApprovalId"
      properties:
        comments:
          type: "string"
          description: "Optional comments for the approval"
        stepApprovalId:
          type: "string"
          description: "ID of the step approval to approve"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
      additionalProperties: false
    AssignRoleRequest:
      type: "object"
      title: "Assign Role Request"
      required:
      - "roleId"
      properties:
        roleId:
          type: "string"
          description: "ID of the role to assign to the user"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
      additionalProperties: false
    Role:
      type: "object"
      required:
      - "code"
      - "name"
      - "userType"
      properties:
        active:
          type: "boolean"
          description: "Whether this role is active and can be assigned"
          default: true
        code:
          type: "string"
          description: "Unique code within the organization"
        description:
          type: "object"
          description: "Description of what this role provides"
          additionalProperties:
            type: "string"
        name:
          type: "string"
          description: "Display name for the role"
        systemRole:
          type: "boolean"
          description: "Whether this is a system-created default role (cannot be deleted)"
          default: false
        userType:
          type: "string"
          description: "Which user types this role can be assigned to"
          enum:
          - "LOGIN"
          - "M2M"
          - "BOTH"
        roleId:
          type: "string"
          description: "Unique identifier for the role"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
        scopes:
          type: "array"
          items:
            $ref: "#/components/schemas/Scope"
        createdDateTime:
          type: "string"
          format: "date-time"
          description: "Timestamp when this record was created"
        modifiedDateTime:
          type: "string"
          format: "date-time"
          description: "Timestamp when this record was last modified"
      additionalProperties: false
    LoginUser:
      type: "object"
      required:
      - "type"
      - "email"
      - "idpUserId"
      properties:
        active:
          type: "boolean"
          description: "Whether this user is active"
          default: true
        roles:
          type: "array"
          items:
            $ref: "#/components/schemas/Role"
        type:
          type: "string"
          description: "Type of authentication user"
          enum:
          - "LOGIN"
          - "M2M"
        userTimeZone:
          $ref: "#/components/schemas/TimeZone"
        authUserId:
          type: "string"
          description: "Unique identifier for the auth user"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
        scopes:
          type: "array"
          items:
            $ref: "#/components/schemas/Scope"
        createdDateTime:
          type: "string"
          format: "date-time"
          description: "Timestamp when this record was created"
        modifiedDateTime:
          type: "string"
          format: "date-time"
          description: "Timestamp when this record was last modified"
        email:
          type: "string"
          format: "email"
          description: "User's email address"
        emailVerified:
          type: "boolean"
          description: "Whether the email address has been verified"
          default: false
        firstName:
          type: "string"
          description: "User's first name"
        idpCreatedAt:
          type: "string"
          format: "date-time"
          description: "Timestamp when the user was created in the identity provider"
        idpUpdatedAt:
          type: "string"
          format: "date-time"
          description: "Timestamp when the user was last updated in the identity provider"
        idpUserId:
          type: "string"
          description: "User ID from the identity provider"
        lastName:
          type: "string"
          description: "User's last name"
        userLanguage:
          type: "string"
          description: "User's preferred language/locale"
        loginUserId:
          type: "string"
          description: "Unique identifier for the login user"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
      additionalProperties: false
    Scope:
      type: "object"
      required:
      - "action"
      - "code"
      - "domain"
      - "interfaceType"
      - "name"
      - "resource"
      - "userType"
      properties:
        action:
          type: "string"
          description: "Action performed on the resource"
          enum:
          - "READ"
          - "CREATE"
          - "UPDATE"
          - "DELETE"
          - "EXECUTE"
          - "MANAGE"
        active:
          type: "boolean"
          description: "Whether this scope is active and can be assigned"
          default: true
        code:
          type: "string"
          description: "Hierarchical URI code: {domain}:{resource}:{action} (e.g.,\
            \ users:profile:read)"
          pattern: "^[a-zA-Z0-9*]+:[a-zA-Z0-9*]+:[a-zA-Z]+$"
        description:
          type: "string"
          description: "Description of what this scope allows"
        domain:
          type: "string"
          description: "Domain component (e.g., 'users', 'orders', 'reports', '*')"
        interfaceType:
          type: "string"
          description: "Whether this scope applies to API, UI, or both"
          enum:
          - "API"
          - "UI"
          - "BOTH"
        name:
          type: "string"
          description: "Name for display purposes"
        resource:
          type: "string"
          description: "Resource component (e.g., 'profile', 'payment', 'financial',\
            \ '*')"
        userType:
          type: "string"
          description: "Which user types this scope applies to"
          enum:
          - "LOGIN"
          - "M2M"
          - "ANY"
        scopeId:
          type: "string"
          description: "Unique identifier for the scope"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
        createdDateTime:
          type: "string"
          format: "date-time"
          description: "Timestamp when this record was created"
        modifiedDateTime:
          type: "string"
          format: "date-time"
          description: "Timestamp when this record was last modified"
      additionalProperties: false
    M2MClient:
      type: "object"
      required:
      - "type"
      - "name"
      - "organizationEnvironmentId"
      - "organizationId"
      - "clientId"
      - "clientSecret"
      properties:
        active:
          type: "boolean"
          description: "Whether this user is active"
          default: true
        roles:
          type: "array"
          items:
            $ref: "#/components/schemas/Role"
        type:
          type: "string"
          description: "Type of authentication user"
          enum:
          - "LOGIN"
          - "M2M"
        userTimeZone:
          $ref: "#/components/schemas/TimeZone"
        authUserId:
          type: "string"
          description: "Unique identifier for the auth user"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
        scopes:
          type: "array"
          items:
            $ref: "#/components/schemas/Scope"
        createdDateTime:
          type: "string"
          format: "date-time"
          description: "Timestamp when this record was created"
        modifiedDateTime:
          type: "string"
          format: "date-time"
          description: "Timestamp when this record was last modified"
        description:
          type: "string"
          description: "Description of the M2M client's purpose"
        managementToken:
          type: "boolean"
          description: "Whether this client has management privileges"
          default: false
        name:
          type: "string"
          description: "Name of the M2M client"
        organizationEnvironmentId:
          type: "string"
          description: "Organization environment identifier for multi-tenant isolation"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
        organizationId:
          type: "string"
          description: "Organization identifier for multi-tenant isolation"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
        roleCode:
          type: "string"
          description: "Code of the role to assign to the M2M client. Defaults to\
            \ 'api_client' if not provided."
        userLanguage:
          type: "string"
          description: "Client's preferred language/locale"
        m2mClientId:
          type: "string"
          description: "Unique identifier for the M2M client"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
        clientId:
          type: "string"
          description: "OAuth2 client identifier"
        clientSecret:
          type: "string"
          description: "OAuth2 client secret (write-only, not returned in responses)"
      additionalProperties: false
    AuthUser:
      title: "Auth User"
      oneOf:
      - $ref: "#/components/schemas/LoginUser"
      - $ref: "#/components/schemas/M2MClient"
    Location:
      type: "object"
      required:
      - "code"
      - "name"
      - "typeCode"
      - "addressLine1"
      - "country"
      properties:
        code:
          type: "string"
          description: "Unique code for this metadata instance"
        dateTimePeriod:
          $ref: "#/components/schemas/DateTimePeriod"
        description:
          type: "object"
          description: "Localized description of the metadata"
          additionalProperties:
            type: "string"
        name:
          type: "string"
          description: "Display name of the metadata"
        parentCode:
          type: "string"
          description: "Code of parent metadata in hierarchy (e.g., for Region ->\
            \ Country -> State -> City relationships)"
        typeCode:
          type: "string"
          description: "Code identifying the metadata type"
        metadataId:
          type: "string"
          description: "Unique identifier for the metadata"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
        createdDateTime:
          type: "string"
          format: "date-time"
          description: "Timestamp when this record was created"
        modifiedDateTime:
          type: "string"
          format: "date-time"
          description: "Timestamp when this record was last modified"
        addressLine1:
          type: "string"
          description: "Primary street address (e.g., street and number)"
        addressLine2:
          type: "string"
          description: "Optional secondary address line (e.g., apartment, suite)"
        addressLine3:
          type: "string"
          description: "Optional third address line for extended formatting"
        addressLine4:
          type: "string"
          description: "Optional fourth address line for district or site codes"
        cityLocality:
          type: "string"
          description: "The city or locality of the location"
        coordinates:
          $ref: "#/components/schemas/Coordinates"
        country:
          $ref: "#/components/schemas/Metadata"
        postalCode:
          type: "string"
          description: "The ZIP or postal code for the location"
          pattern: "^[A-Za-z0-9\\-\\s]{3,12}$"
        stateProvinceRegion:
          type: "string"
          description: "The region or administrative area of the location"
        locationId:
          type: "string"
          description: "Unique identifier for the location"
          pattern: "^[a-zA-Z][a-zA-Z0-9]{1,3}_[a-fA-F0-9]{32}$"
      additionalProperties: false
    Item:
      type: "object"
      required:
      - "code"
      - "name"
      - "typeCode"
