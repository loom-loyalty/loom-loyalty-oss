openapi: "3.0.1"
info:
  title: "Loom Loyalty API"
  description: "Consolidated API specification for Loom Loyalty platform"
  version: "1.0.0"
  contact:
    name: "Loom Loyalty"
    url: "https://www.loomloyalty.com"
    email: "support@loomloyalty.com"
servers:
- url: "https://api.loomloyalty.com"
  description: "Current server"
paths:
  /auth/me/roles:
    get:
      tags:
      - "auth/me"
      summary: "Get my assigned roles"
      description: "Returns the list of roles assigned to the currently authenticated\
        \ user"
      operationId: "auth-management_listMyRoles"
      responses:
        "200":
          description: "List of assigned roles"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRole"
        "401":
          description: "Unauthorized"
  /auth/me/scope-codes:
    get:
      tags:
      - "auth/me"
      summary: "Get my effective scope codes"
      description: "Returns the scope code strings for the authenticated user, for\
        \ lightweight permission checks"
      operationId: "auth-management_listMyScopeCodes"
      responses:
        "200":
          description: "Scope code strings"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseMyScopeCodes"
        "401":
          description: "Unauthorized"
  /auth/me/scopes:
    get:
      tags:
      - "auth/me"
      summary: "Get my effective scopes"
      description: "Returns the set of effective scopes for the currently authenticated\
        \ user, aggregated from all assigned roles"
      operationId: "auth-management_listMyScopes"
      responses:
        "200":
          description: "Set of effective scopes"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListScope"
        "401":
          description: "Unauthorized"
  /clients:
    get:
      tags:
      - "configuration/m2m-clients"
      summary: "Get all M2M clients"
      description: "Returns a paginated list of M2M clients for the current organization"
      operationId: "auth-management_listM2MClients"
      parameters:
      - name: "page"
        in: "query"
        description: "Page number"
        required: false
        explode: false
        schema:
          type: "integer"
          format: "int32"
          default: 0
      - name: "size"
        in: "query"
        description: "Page size"
        required: false
        explode: false
        schema:
          type: "integer"
          format: "int32"
          default: 10
      responses:
        "200":
          description: "List of M2M clients"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedM2MClient"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
    post:
      tags:
      - "configuration/m2m-clients"
      summary: "Create M2M client"
      description: "Creates a new M2M client with the provided data"
      operationId: "auth-management_createM2MClient"
      requestBody:
        description: "M2M client data"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateM2MClient"
        required: true
      responses:
        "200":
          description: "The created M2M client"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseM2MClient"
        "400":
          description: "Invalid input data"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
  /clients/by-client-id/{clientId}:
    get:
      tags:
      - "configuration/m2m-clients"
      summary: "Get M2M client by client ID"
      description: "Returns a single M2M client by its client ID"
      operationId: "auth-management_getM2MClientByClientId"
      parameters:
      - name: "clientId"
        in: "path"
        description: "Client ID"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "The M2M client"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseM2MClient"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "404":
          description: "M2M client not found"
  /clients/{clientId}/roles:
    get:
      tags:
      - "configuration/m2m-clients"
      summary: "Get all roles assigned to M2M client"
      description: "Returns a list of all roles assigned to an M2M client"
      operationId: "auth-management_listM2MClientRoles"
      parameters:
      - name: "clientId"
        in: "path"
        description: "M2M client ID"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "List of assigned roles"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRole"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "404":
          description: "M2M client not found"
    post:
      tags:
      - "configuration/m2m-clients"
      summary: "Assign role to M2M client"
      description: "Assigns a role to an M2M client"
      operationId: "auth-management_assignRoleToM2MClient"
      parameters:
      - name: "clientId"
        in: "path"
        description: "M2M client ID"
        required: true
        schema:
          type: "string"
          format: "uuid"
      requestBody:
        description: "Role to assign"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignRoleRequest"
        required: true
      responses:
        "200":
          description: "Role assigned successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseUserRoleAssignment"
        "400":
          description: "Invalid input data"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "404":
          description: "M2M client or role not found"
  /clients/{clientId}/roles/{roleId}:
    delete:
      tags:
      - "configuration/m2m-clients"
      summary: "Unassign role from M2M client"
      description: "Removes a role assignment from an M2M client"
      operationId: "auth-management_unassignRoleFromM2MClient"
      parameters:
      - name: "clientId"
        in: "path"
        description: "M2M client ID"
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "roleId"
        in: "path"
        description: "Role ID"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "Role unassigned successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseVoid"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "404":
          description: "M2M client or role not found"
  /clients/{clientId}/scopes:
    get:
      tags:
      - "configuration/m2m-clients"
      summary: "Get effective scopes for M2M client"
      description: "Returns a set of all effective scopes for an M2M client (aggregated\
        \ from all assigned roles)"
      operationId: "auth-management_listM2MClientScopes"
      parameters:
      - name: "clientId"
        in: "path"
        description: "M2M client ID"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "Set of effective scopes"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListScope"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "404":
          description: "M2M client not found"
  /clients/{id}:
    get:
      tags:
      - "configuration/m2m-clients"
      summary: "Get M2M client by ID"
      description: "Returns a single M2M client by its ID"
      operationId: "auth-management_getM2MClient"
      parameters:
      - name: "id"
        in: "path"
        description: "M2M client ID"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "The M2M client"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseM2MClient"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "404":
          description: "M2M client not found"
    put:
      tags:
      - "configuration/m2m-clients"
      summary: "Update M2M client"
      description: "Updates an existing M2M client with the provided data"
      operationId: "auth-management_updateM2MClient"
      parameters:
      - name: "id"
        in: "path"
        description: "M2M client ID"
        required: true
        schema:
          type: "string"
          format: "uuid"
      requestBody:
        description: "Updated M2M client data"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateM2MClient"
        required: true
      responses:
        "200":
          description: "The updated M2M client"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseM2MClient"
        "400":
          description: "Invalid input data"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "404":
          description: "M2M client not found"
    delete:
      tags:
      - "configuration/m2m-clients"
      summary: "Delete M2M client"
      description: "Deletes an M2M client by its ID"
      operationId: "auth-management_deleteM2MClient"
      parameters:
      - name: "id"
        in: "path"
        description: "M2M client ID"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "M2M client deleted successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseVoid"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "404":
          description: "M2M client not found"
  /login-users:
    get:
      tags:
      - "configuration/login-users"
      summary: "Get all login users"
      description: "Returns a paginated list of all login users"
      operationId: "auth-management_listLoginUsers"
      parameters:
      - name: "page"
        in: "query"
        description: "Page number"
        required: false
        explode: false
        schema:
          type: "integer"
          format: "int32"
          default: 0
      - name: "size"
        in: "query"
        description: "Page size"
        required: false
        explode: false
        schema:
          type: "integer"
          format: "int32"
          default: 10
      responses:
        "200":
          description: "List of login users"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedLoginUser"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
    post:
      tags:
      - "configuration/login-users"
      summary: "Create login user"
      description: "Creates a new login user with the provided data"
      operationId: "auth-management_createLoginUser"
      requestBody:
        description: "Login user data"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLoginUser"
        required: true
      responses:
        "200":
          description: "The created login user"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseLoginUser"
        "400":
          description: "Invalid input data"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
  /login-users/by-idp-user-id/{idpUserId}:
    get:
      tags:
      - "configuration/login-users"
      summary: "Get login user by IDP user ID"
      description: "Returns a single login user by its IDP user ID"
      operationId: "auth-management_getLoginUserByIdpUserId"
      parameters:
      - name: "idpUserId"
        in: "path"
        description: "IDP user ID"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "The login user"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseLoginUser"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "404":
          description: "Login user not found"
  /login-users/{id}:
    get:
      tags:
      - "configuration/login-users"
      summary: "Get login user by ID"
      description: "Returns a single login user by its ID"
      operationId: "auth-management_getLoginUser"
      parameters:
      - name: "id"
        in: "path"
        description: "Login user ID"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "The login user"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseLoginUser"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "404":
          description: "Login user not found"
    put:
      tags:
      - "configuration/login-users"
      summary: "Update login user"
      description: "Updates an existing login user with the provided data"
      operationId: "auth-management_updateLoginUser"
      parameters:
      - name: "id"
        in: "path"
        description: "Login user ID"
        required: true
        schema:
          type: "string"
          format: "uuid"
      requestBody:
        description: "Updated login user data"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLoginUser"
        required: true
      responses:
        "200":
          description: "The updated login user"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseLoginUser"
        "400":
          description: "Invalid input data"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "404":
          description: "Login user not found"
    delete:
      tags:
      - "configuration/login-users"
      summary: "Delete login user"
      description: "Deletes a login user by its ID"
      operationId: "auth-management_deleteLoginUser"
      parameters:
      - name: "id"
        in: "path"
        description: "Login user ID"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "Login user deleted successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseVoid"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "404":
          description: "Login user not found"
  /login-users/{userId}/roles:
    get:
      tags:
      - "configuration/login-users"
      summary: "Get all roles assigned to login user"
      description: "Returns a list of all roles assigned to a login user"
      operationId: "auth-management_listLoginUserRoles"
      parameters:
      - name: "userId"
        in: "path"
        description: "Login user ID"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "List of assigned roles"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRole"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "404":
          description: "Login user not found"
    post:
      tags:
      - "configuration/login-users"
      summary: "Assign role to login user"
      description: "Assigns a role to a login user"
      operationId: "auth-management_assignRoleToLoginUser"
      parameters:
      - name: "userId"
        in: "path"
        description: "Login user ID"
        required: true
        schema:
          type: "string"
          format: "uuid"
      requestBody:
        description: "Role to assign"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignRoleRequest"
        required: true
      responses:
        "200":
          description: "Role assigned successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseUserRoleAssignment"
        "400":
          description: "Invalid input data"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "404":
          description: "Login user or role not found"
  /login-users/{userId}/roles/{roleId}:
    delete:
      tags:
      - "configuration/login-users"
      summary: "Unassign role from login user"
      description: "Removes a role assignment from a login user"
      operationId: "auth-management_unassignRoleFromLoginUser"
      parameters:
      - name: "userId"
        in: "path"
        description: "Login user ID"
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "roleId"
        in: "path"
        description: "Role ID"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "Role unassigned successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseVoid"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "404":
          description: "Login user or role not found"
  /login-users/{userId}/scopes:
    get:
      tags:
      - "configuration/login-users"
      summary: "Get effective scopes for login user"
      description: "Returns a set of all effective scopes for a login user (aggregated\
        \ from all assigned roles)"
      operationId: "auth-management_listLoginUserScopes"
      parameters:
      - name: "userId"
        in: "path"
        description: "Login user ID"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "Set of effective scopes"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListScope"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "404":
          description: "Login user not found"
  /oauth/token:
    post:
      tags:
      - "configuration/oauth"
      summary: "Create OAuth2 token"
      description: "Handles client_credentials and refresh_token grant types"
      operationId: "auth-management_createOAuth2Token"
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuth2TokenRequest"
        required: true
      responses:
        "200":
          description: "createOAuth2Token 200 response"
          content:
            application/json:
              schema:
                type: "object"
  /roles:
    get:
      tags:
      - "configuration/roles"
      summary: "Get all roles"
      description: "Returns a paginated list of all roles"
      operationId: "auth-management_listRoles"
      parameters:
      - name: "page"
        in: "query"
        description: "Page number"
        required: false
        explode: false
        schema:
          type: "integer"
          format: "int32"
          default: 0
      - name: "size"
        in: "query"
        description: "Page size"
        required: false
        explode: false
        schema:
          type: "integer"
          format: "int32"
          default: 10
      responses:
        "200":
          description: "List of roles"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedRole"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
    post:
      tags:
      - "configuration/roles"
      summary: "Create role"
      description: "Creates a new role with the provided data"
      operationId: "auth-management_createRole"
      requestBody:
        description: "Role data"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRole"
        required: true
      responses:
        "200":
          description: "The created role"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseRole"
        "400":
          description: "Invalid input data"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
  /roles/{id}:
    get:
      tags:
      - "configuration/roles"
      summary: "Get role by ID"
      description: "Returns a single role by its ID"
      operationId: "auth-management_getRole"
      parameters:
      - name: "id"
        in: "path"
        description: "Role ID"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "The role"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseRole"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "404":
          description: "Role not found"
    put:
      tags:
      - "configuration/roles"
      summary: "Update role"
      description: "Updates an existing role with the provided data"
      operationId: "auth-management_updateRole"
      parameters:
      - name: "id"
        in: "path"
        description: "Role ID"
        required: true
        schema:
          type: "string"
          format: "uuid"
      requestBody:
        description: "Updated role data"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRole"
        required: true
      responses:
        "200":
          description: "The updated role"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseRole"
        "400":
          description: "Invalid input data"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "404":
          description: "Role not found"
    delete:
      tags:
      - "configuration/roles"
      summary: "Delete role"
      description: "Deletes a role by its ID"
      operationId: "auth-management_deleteRole"
      parameters:
      - name: "id"
        in: "path"
        description: "Role ID"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "Role deleted successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseVoid"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "404":
          description: "Role not found"
  /roles/{roleId}/scopes:
    put:
      tags:
      - "configuration/roles"
      summary: "Set all scopes for role"
      description: "Replaces all scopes for a role with the provided set of scopes"
      operationId: "auth-management_setRoleScopes"
      parameters:
      - name: "roleId"
        in: "path"
        description: "Role ID"
        required: true
        schema:
          type: "string"
          format: "uuid"
      requestBody:
        description: "Scopes to set"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetScopesRequest"
        required: true
      responses:
        "200":
          description: "The updated role with new scopes"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseRole"
        "400":
          description: "Invalid input data"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "404":
          description: "Role not found"
    post:
      tags:
      - "configuration/roles"
      summary: "Add scope to role"
      description: "Adds a scope to an existing role"
      operationId: "auth-management_addScopeToRole"
      parameters:
      - name: "roleId"
        in: "path"
        description: "Role ID"
        required: true
        schema:
          type: "string"
          format: "uuid"
      requestBody:
        description: "Scope to add"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddScopeRequest"
        required: true
      responses:
        "200":
          description: "The updated role with added scope"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseRole"
        "400":
          description: "Invalid input data"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "404":
          description: "Role or scope not found"
  /roles/{roleId}/scopes/{scopeId}:
    delete:
      tags:
      - "configuration/roles"
      summary: "Remove scope from role"
      description: "Removes a scope from an existing role"
      operationId: "auth-management_removeScopeFromRole"
      parameters:
